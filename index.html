<script>
(function() {
  const NEW_NAME = "متجر كارفور سيتي سمارت";
  const NEW_PHONE = "26141711";
  const NEW_WA = "22226141711";

  // 1. تحديث بيانات الإعدادات المخزنة في المتصفح إن وجدت
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      let val = localStorage.getItem(key);
      if (val && (val.includes("مجتمع الناجحين") || val.includes("48436080") || val.includes("22010206"))) {
        val = val.replace(/معشبة\s*مجتمع\s*الناجحين|مجتمع\s*الناجحين/g, NEW_NAME)
                 .replace(/48436080|22010206/g, NEW_PHONE);
        localStorage.setItem(key, val);
      }
    }
  } catch (e) {}

  // 2. دالة استبدال شاملة لكل النصوص والروابط في الصفحة
  function applyBranding() {
    if (document.title.includes("الناجحين") || document.title.includes("معشبة")) {
      document.title = NEW_NAME + " – نواكشوط";
    }

    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    let node;
    while (node = walker.nextNode()) {
      let text = node.nodeValue;
      if (/معشبة|مجتمع\s*الناجحين/.test(text)) {
        text = text.replace(/معشبة\s*مجتمع\s*الناجحين|مجتمع\s*الناجحين|معشبة/g, NEW_NAME);
      }
      if (/48\s*43\s*60\s*80|22\s*01\s*02\s*06/.test(text)) {
        text = text.replace(/\+?222\s*48\s*43\s*60\s*80|\+?222\s*22\s*01\s*02\s*06|48\s*43\s*60\s*80|22\s*01\s*02\s*06/g, "+222 26 14 17 11");
      }
      if (node.nodeValue !== text) node.nodeValue = text;
    }

    document.querySelectorAll('a[href], button[onclick]').forEach(el => {
      if (el.href && (el.href.includes("48436080") || el.href.includes("22010206"))) {
        el.href = el.href.replace(/22248436080|22222010206|48436080|22010206/g, NEW_WA);
      }
    });
  }

  applyBranding();
  window.addEventListener("load", applyBranding);
  new MutationObserver(applyBranding).observe(document.body, { childList: true, subtree: true, characterData: true });
})();
</script>
